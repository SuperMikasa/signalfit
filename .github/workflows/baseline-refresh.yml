name: Weekly AI capability baseline check

on:
  schedule:
    - cron: "23 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  baseline-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check baseline freshness
        id: freshness
        run: python3 tools/check_baseline_freshness.py --max-age-days 14 --github-output "$GITHUB_OUTPUT"
      - name: Open a reviewed refresh task when stale
        if: steps.freshness.outputs.stale == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Baseline refresh] AI 岗位能力地图需要更新";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            const issue = existing.data.find(item => item.title === title);
            const body = [
              `当前公开基线已有 ${process.env.AGE_DAYS} 天，超过 ${process.env.MAX_AGE_DAYS} 天的新鲜度目标。`,
              "",
              "维护清单：",
              "- [ ] 收集仍然有效的 AI 产品、AI 全栈 / Agent 工程、FDE 官方 JD",
              "- [ ] 审核社区提交的真实面经与能力建议",
              "- [ ] 只将 accepted + real_interview_report 计入真实面经",
              "- [ ] 运行 build-role-capability-map 并保留 provisional 状态（如基线未完成）",
              "- [ ] 回读三个岗位的 Top 能力、JD 数、面经数和约束",
              "",
              `最近生成时间：${process.env.GENERATED_AT}`,
            ].join("\n");
            if (issue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
        env:
          AGE_DAYS: ${{ steps.freshness.outputs.age_days }}
          MAX_AGE_DAYS: ${{ steps.freshness.outputs.max_age_days }}
          GENERATED_AT: ${{ steps.freshness.outputs.generated_at }}
