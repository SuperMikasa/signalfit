name: 提交 AI 岗位面经
description: 提交可核验来源的真实 AI 岗位面试题或面试流程
title: "[AI 面经] "
labels: ["evidence:interview", "needs-review"]
body:
  - type: dropdown
    id: role
    attributes:
      label: 岗位方向
      options:
        - AI 产品
        - AI 全栈 / Agent 工程
        - FDE / 前线部署工程
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 公开来源链接
      description: 必须能定位到原始公开页面；无法核验的内容不会进入真实面经统计。
    validations:
      required: true
  - type: textarea
    id: questions
    attributes:
      label: 面试问题或流程摘要
      description: 请用自己的话概括，不要复制受限全文，也不要提供候选人身份信息。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 内容来自真实面试报告，并已移除姓名、联系方式、账号和其他隐私信息。
          required: true
        - label: 我理解该提交必须经过 accepted 审核才会计入能力地图。
          required: true
