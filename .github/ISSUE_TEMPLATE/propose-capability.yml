name: 建议新的 AI 岗位能力
description: 用多个公开证据建议新增、合并或调整一个能力轴
title: "[能力建议] "
labels: ["capability-proposal", "needs-review"]
body:
  - type: input
    id: capability
    attributes:
      label: 能力名称
      placeholder: 例如：多模态 Agent 评测
    validations:
      required: true
  - type: checkboxes
    id: roles
    attributes:
      label: 适用岗位
      options:
        - label: AI 产品
        - label: AI 全栈 / Agent 工程
        - label: FDE / 前线部署工程
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 支持证据
      description: 请提供至少两个独立公开 JD 或已核验面经链接，并解释它们为何指向同一能力。
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: 与现有能力的边界
      description: 说明为什么不能归入已有能力轴。
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: 提交确认
      options:
        - label: 提交不包含简历、私人聊天记录、账号凭据或受限全文。
          required: true
